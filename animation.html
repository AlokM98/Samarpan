<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karwa Chauth  | Chalni & Chand</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet"
  />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="animation-style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Fixed full-screen 3D canvas -->
  <canvas id="scene-canvas"></canvas>

  <!-- Text overlay, driven by scroll progress in ui.js -->
  <div id="overlay">
    <div id="intro-text" class="ui-block">
      <p class="eyebrow">Karwa Chauth</p>
      <p class="hint">Scroll to let the chalni drift away and reveal the moon ↓</p>
    </div>

    <div id="outro-text" class="ui-block">
      <p class="eyebrow">Chand Nikal Aaya</p>
      <h1>Happy Karwa Chauth</h1>
      <p class="hint">May your bond shine as bright as the moon tonight </p>
    </div>
  </div>

  <!-- Tall scroll spacer so the page actually has scroll distance -->
  <div id="scroll-spacer"></div>

  <script type="module" src="src/main.js?v=original"></script>
  <script src="animation-bridge.js"></script>
</body>
</html>
